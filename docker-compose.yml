services:
  bot:
    build: .
    container_name: telebot
    restart: unless-stopped
    environment:
      # إجباري
      TOKEN: "${TOKEN}"
      # اختياري
      SUDO_ID: "${SUDO_ID:-}"
      USER_SUDO: "${USER_SUDO:-}"
      OPENAI_KEY: "${OPENAI_KEY:-}"
    volumes:
      # تخزين TDLib — لازم يفضل محفوظ بين الريستارتات، من غيره البوت
      # هيعا��ل تسجيل دخول من الصفر في كل مرة
      - botdata:/app/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: telebot-redis
    restart: unless-stopped
    # من غير كل��ة سر، أي حد على نفس الشبكة يقدر يوصل للبيانات
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

volumes:
  botdata:
  redisdata:
